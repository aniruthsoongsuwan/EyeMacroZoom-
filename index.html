<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Eye Macro Zoom — ซูมทะลุดวงตาจากใบหน้า</title>
  <style>
    :root {
      --bg: #07060a;
      --surface: rgba(18, 16, 24, 0.82);
      --border: rgba(245, 158, 11, 0.28);
      --ink: #f8fafc;
      --muted: #cbd5e1;
      --brand: #f59e0b;
      --brand-light: #fde68a;
      --accent: #38bdf8;
      --radius: 14px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      touch-action: none;
    }

    .app-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1c1408 0%, #07060a 75%);
    }

    #zoomCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    #zoomCanvas:active {
      cursor: grabbing;
    }

    /* Source portrait image kept accessible in DOM for canvas rendering & thumbnail preview */
    .portrait-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 8px 14px 8px 8px;
      border-radius: var(--radius);
      z-index: 10;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    }

    .portrait-thumb-wrap {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid var(--brand);
      flex-shrink: 0;
      background: #1a1206;
    }

    #face-source-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge-meta h1 {
      font-size: 14px;
      font-weight: 700;
      color: var(--brand-light);
      letter-spacing: 0.2px;
    }

    .badge-meta p {
      font-size: 11px;
      color: var(--muted);
    }

    .badge-meta a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
    }

    .badge-meta a:hover {
      text-decoration: underline;
    }

    /* Bottom Control Dock */
    .control-dock {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(680px, calc(100vw - 24px));
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.65);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .zoom-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--brand-light);
      min-width: 78px;
      font-variant-numeric: tabular-nums;
    }

    .zoom-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      outline: none;
      cursor: pointer;
    }

    .zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--brand);
      border: 2px solid #fff;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
      cursor: pointer;
    }

    .buttons-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.07);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(245, 158, 11, 0.5);
    }

    .btn-primary {
      background: var(--brand);
      color: #090602;
      border-color: var(--brand);
      font-weight: 700;
    }

    .btn-primary:hover {
      background: #fbbf24;
    }

    .btn.active {
      border-color: var(--brand);
      color: var(--brand-light);
      background: rgba(245, 158, 11, 0.18);
    }

    .stage-pill {
      font-size: 11px;
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 600px) {
      .portrait-badge {
        top: 10px;
        left: 10px;
        right: 10px;
      }
      .control-dock {
        bottom: 10px;
        padding: 10px 12px;
      }
      .stage-pill {
        display: none;
      }
    }
  </style>
</head>

    <section class="control-dock" aria-label="ควบคุมการซูมดวงตา">
      <div class="slider-row">
        <span class="zoom-label" id="zoom-readout">1.0x</span>
        <input type="range" id="zoom-slider" class="zoom-slider" min="0" max="1000" value="0" aria-label="ระดับการซูมดวงตา">
        <span class="stage-pill" id="stage-indicator">ระยะที่ 1: ภาพใบหน้า (Portrait)</span>
      </div>

      <div class="buttons-row">
        <div class="btn-group">
          <button type="button" class="btn btn-primary" id="btn-play">⏸ หยุดชั่วคราว</button>
          <button type="button" class="btn" id="btn-reset">↺ เริ่มต้นใหม่</button>
        </div>

        <div class="btn-group">
          <button type="button" class="btn active" id="btn-eye-left">👁️ ดวงตาซ้าย (บนจอ)</button>
          <button type="button" class="btn" id="btn-eye-right">👁️ ดวงตาขวา (บนจอ)</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const canvas = document.getElementById('zoomCanvas');
      const ctx = canvas.getContext('2d');
      const faceImg = document.getElementById('face-source-img');
      const slider = document.getElementById('zoom-slider');
      const zoomReadout = document.getElementById('zoom-readout');
      const stageIndicator = document.getElementById('stage-indicator');
      const btnPlay = document.getElementById('btn-play');
      const btnReset = document.getElementById('btn-reset');
      const btnEyeLeft = document.getElementById('btn-eye-left');
      const btnEyeRight = document.getElementById('btn-eye-right');

      // Exact verified pupil coordinates from IMG_6884.PNG cropped face portrait
      const EYES = {
        left:  { x: 0.4578, y: 0.4224, label: 'ดวงตาซ้าย' },
        right: { x: 0.7172, y: 0.4190, label: 'ดวงตาขวา' }
      };

      let activeEye = 'left';
      let progress = 0;        // 0.0 (1x portrait) -> 1.0 (120x deep inside pupil universe)
      let isPlaying = true;
      let direction = 1;       // 1 = zooming in, -1 = zooming out
      let lastTime = performance.now();

      // Pre-generate iris fiber seeds & cosmic starfield inside the pupil
      const NUM_FIBERS = 180;
      const irisFibers = [];
      for (let i = 0; i < NUM_FIBERS; i++) {
        const angle = (i / NUM_FIBERS) * Math.PI * 2;
        irisFibers.push({
          angle,
          wobble: (Math.random() - 0.5) * 0.08,
          lenInner: 0.28 + Math.random() * 0.06,
          lenOuter: 0.86 + Math.random() * 0.13,
          width: 0.8 + Math.random() * 1.8,
          hueShift: Math.floor(Math.random() * 25) - 10,
          lightness: 24 + Math.floor(Math.random() * 34)
        });
      }

      const NUM_STARS = 140;
      const cosmicStars = [];
      for (let i = 0; i < NUM_STARS; i++) {
        cosmicStars.push({
          angle: Math.random() * Math.PI * 2,
          dist: 0.02 + Math.random() * 0.98,
          size: 0.6 + Math.random() * 2.2,
          speed: 0.15 + Math.random() * 0.45,
          gold: Math.random() > 0.35
        });
      }

      // Offscreen circular masked portrait canvas so ONLY the face appears cleanly
      const portraitBuffer = document.createElement('canvas');
      const pCtx = portraitBuffer.getContext('2d');
      let portraitReady = false;

      function preparePortraitBuffer() {
        if (!faceImg.complete || !faceImg.naturalWidth) return;
        const w = faceImg.naturalWidth;
        const h = faceImg.naturalHeight;
        portraitBuffer.width = w;
        portraitBuffer.height = h;

        pCtx.clearRect(0, 0, w, h);

        // Create soft oval vignette around the head/face only
        pCtx.save();
        pCtx.beginPath();
        pCtx.ellipse(w * 0.55, h * 0.47, w * 0.43, h * 0.46, 0, 0, Math.PI * 2);
        pCtx.closePath();
        pCtx.clip();

        pCtx.drawImage(faceImg, 0, 0, w, h);

        // Soft inner edge feathering so the portrait emerges from dark golden aura
        const grad = pCtx.createRadialGradient(
          w * 0.55, h * 0.46, w * 0.25,
          w * 0.55, h * 0.46, w * 0.46
        );
        grad.addColorStop(0, 'rgba(7, 6, 10, 0)');
        grad.addColorStop(0.78, 'rgba(7, 6, 10, 0.15)');
        grad.addColorStop(1, 'rgba(7, 6, 10, 0.98)');
        pCtx.fillStyle = grad;
        pCtx.fillRect(0, 0, w, h);
        pCtx.restore();

        portraitReady = true;
      }

      faceImg.addEventListener('load', preparePortraitBuffer);
      if (faceImg.complete) preparePortraitBuffer();

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // Exponential zoom factor from 1x to 140x
      function getZoomFactor(p) {
        return Math.pow(140, p);
      }

      function updateReadout(p) {
        const z = getZoomFactor(p);
        zoomReadout.textContent = z < 10 ? z.toFixed(1) + 'x' : Math.round(z) + 'x';
        slider.value = Math.round(p * 1000);

        if (p < 0.28) {
          stageIndicator.textContent = 'ระยะที่ 1: เฉพาะใบหน้า (Face Portrait)';
        } else if (p < 0.68) {
          stageIndicator.textContent = 'ระยะที่ 2: ซูมเข้าสู่ม่านตา (Macro Iris Fibers)';
        } else {
          stageIndicator.textContent = 'ระยะที่ 3: ทะลุรูม่านตา (Deep Pupil Cosmos)';
        }
      }

      function drawMacroEyeOverlay(ctx, cx, cy, eyeRadiusPx, p, timeSec) {
        // Blend in macro iris detail smoothly starting at p = 0.16
        const macroAlpha = Math.min(1, Math.max(0, (p - 0.14) / 0.25));
        if (macroAlpha <= 0.001) return;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.globalAlpha = macroAlpha;

        // 1. Sclera & outer limbal ring shadow
        const limbalGrad = ctx.createRadialGradient(0, 0, eyeRadiusPx * 0.72, 0, 0, eyeRadiusPx * 1.18);
        limbalGrad.addColorStop(0, 'rgba(20, 12, 6, 0)');
        limbalGrad.addColorStop(0.82, 'rgba(12, 7, 4, 0.85)');
        limbalGrad.addColorStop(1, 'rgba(7, 5, 8, 0)');
        ctx.fillStyle = limbalGrad;
        ctx.beginPath();
        ctx.arc(0, 0, eyeRadiusPx * 1.18, 0, Math.PI * 2);
        ctx.fill();

        // 2. Base warm brown & golden-amber iris dome
        const irisGrad = ctx.createRadialGradient(0, 0, eyeRadiusPx * 0.22, 0, 0, eyeRadiusPx);
        irisGrad.addColorStop(0, '#120904');
        irisGrad.addColorStop(0.28, '#45220a');
        irisGrad.addColorStop(0.58, '#6b3410');
        irisGrad.addColorStop(0.85, '#3b1a08');
        irisGrad.addColorStop(1, '#0d0704');

        ctx.fillStyle = irisGrad;
        ctx.beginPath();
        ctx.arc(0, 0, eyeRadiusPx, 0, Math.PI * 2);
        ctx.fill();

        // 3. Detailed radial iris stroma fibers (like the macro clip)
        for (let i = 0; i < irisFibers.length; i++) {
          const f = irisFibers[i];
          const a1 = f.angle + Math.sin(timeSec * 0.6 + i) * 0.008;
          const a2 = a1 + f.wobble;
          const r1 = eyeRadiusPx * f.lenInner;
          const r2 = eyeRadiusPx * f.lenOuter;

          ctx.strokeStyle = `hsla(${30 + f.hueShift}, 78%, ${f.lightness}%, 0.42)`;
          ctx.lineWidth = Math.max(1, (eyeRadiusPx / 180) * f.width);
          ctx.beginPath();
          ctx.moveTo(Math.cos(a1) * r1, Math.sin(a1) * r1);
          ctx.quadraticCurveTo(
            Math.cos((a1 + a2) * 0.5) * ((r1 + r2) * 0.52),
            Math.sin((a1 + a2) * 0.5) * ((r1 + r2) * 0.52),
            Math.cos(a2) * r2,
            Math.sin(a2) * r2
          );
          ctx.stroke();
        }

        // Golden collarette ring around the pupil
        ctx.strokeStyle = 'rgba(251, 191, 36, 0.35)';
        ctx.lineWidth = Math.max(1.5, eyeRadiusPx * 0.025);
        ctx.beginPath();
        ctx.arc(0, 0, eyeRadiusPx * 0.42, 0, Math.PI * 2);
        ctx.stroke();

        // 4. Deep Pupil Portal & Cosmic Golden Tunnel inside the pupil
        const pupilRadius = eyeRadiusPx * 0.31;
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, pupilRadius, 0, Math.PI * 2);
        ctx.clip();

        // Deep abyss base
        const pupilGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, pupilRadius);
        pupilGrad.addColorStop(0, '#1e1035');
        pupilGrad.addColorStop(0.45, '#090414');
        pupilGrad.addColorStop(1, '#020104');
        ctx.fillStyle = pupilGrad;
        ctx.fillRect(-pupilRadius, -pupilRadius, pupilRadius * 2, pupilRadius * 2);

        // Cosmic nebula & golden sacred geometry inside pupil when zooming deep (p > 0.35)
        const cosmicAlpha = Math.min(1, Math.max(0, (p - 0.32) / 0.35));
        if (cosmicAlpha > 0.01) {
          ctx.globalAlpha = macroAlpha * cosmicAlpha;

          // Rotating golden energy rings inside the pupil
          const numRings = 5;
          for (let r = 1; r <= numRings; r++) {
            const ringScale = ((r / numRings) + (timeSec * 0.12) % (1 / numRings));
            const rad = pupilRadius * Math.pow(ringScale, 1.4);
            ctx.strokeStyle = `rgba(251, 191, 36, ${(1 - ringScale) * 0.55})`;
            ctx.lineWidth = Math.max(1, pupilRadius * 0.012);
            ctx.beginPath();
            ctx.arc(0, 0, rad, 0, Math.PI * 2);
            ctx.stroke();
          }

          // Starfield / neural sparks zooming outward from pupil center
          for (let i = 0; i < cosmicStars.length; i++) {
            const st = cosmicStars[i];
            const animatedDist = (st.dist + timeSec * st.speed * 0.25) % 1;
            const rPx = Math.pow(animatedDist, 1.6) * pupilRadius;
            const sx = Math.cos(st.angle + timeSec * 0.15) * rPx;
            const sy = Math.sin(st.angle + timeSec * 0.15) * rPx;
            const sz = Math.max(0.8, st.size * (pupilRadius / 140) * (0.4 + animatedDist));

            ctx.fillStyle = st.gold
              ? `rgba(253, 224, 71, ${0.25 + animatedDist * 0.75})`
              : `rgba(125, 211, 252, ${0.2 + animatedDist * 0.7})`;
            ctx.beginPath();
            ctx.arc(sx, sy, sz, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();

        // 5. Realistic Corneal Specular Catchlight (fades gently as we pass through the pupil)
        const catchlightAlpha = Math.max(0, 1 - Math.max(0, (p - 0.65) / 0.28));
        if (catchlightAlpha > 0.01) {
          ctx.globalAlpha = macroAlpha * catchlightAlpha * 0.78;
          const hlGrad = ctx.createRadialGradient(
            -eyeRadiusPx * 0.24, -eyeRadiusPx * 0.26, eyeRadiusPx * 0.01,
            -eyeRadiusPx * 0.24, -eyeRadiusPx * 0.26, eyeRadiusPx * 0.22
          );
          hlGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
          hlGrad.addColorStop(0.4, 'rgba(254, 243, 199, 0.45)');
          hlGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = hlGrad;
          ctx.beginPath();
          ctx.arc(-eyeRadiusPx * 0.24, -eyeRadiusPx * 0.26, eyeRadiusPx * 0.22, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function render(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        if (isPlaying) {
          progress += direction * dt * 0.14; // ~7 seconds per full zoom sweep
          if (progress >= 1) {
            progress = 1;
            direction = -1;
          } else if (progress <= 0) {
            progress = 0;
            direction = 1;
          }
          updateReadout(progress);
        }

        const cw = canvas.width;
        const ch = canvas.height;
        ctx.clearRect(0, 0, cw, ch);

        // Ambient golden dust background
        const bgGrad = ctx.createRadialGradient(cw * 0.5, ch * 0.5, 10, cw * 0.5, ch * 0.5, Math.max(cw, ch) * 0.65);
        bgGrad.addColorStop(0, '#211507');
        bgGrad.addColorStop(0.6, '#0c080d');
        bgGrad.addColorStop(1, '#050408');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, cw, ch);

        if (portraitReady) {
          const pw = portraitBuffer.width;
          const ph = portraitBuffer.height;
          const baseScale = Math.min(cw / pw, ch / ph) * 0.88;
          const zoom = getZoomFactor(progress);
          const totalScale = baseScale * zoom;

          const target = EYES[activeEye];
          // Interpolate focal point from center of face (0.54, 0.46) at 1x to exact pupil center as zoom increases
          const focusBlend = Math.min(1, progress * 2.2);
          const focusX = (0.54 * (1 - focusBlend) + target.x * focusBlend) * pw;
          const focusY = (0.46 * (1 - focusBlend) + target.y * focusBlend) * ph;

          const drawX = cw * 0.5 - focusX * totalScale;
          const drawY = ch * 0.5 - focusY * totalScale;

          ctx.save();
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(portraitBuffer, drawX, drawY, pw * totalScale, ph * totalScale);
          ctx.restore();

          // Exact screen position of the target pupil
          const pupilScreenX = drawX + target.x * pw * totalScale;
          const pupilScreenY = drawY + target.y * ph * totalScale;
          // In the cropped portrait, the iris radius is ~2.35% of the portrait width
          const irisRadiusPx = pw * 0.0235 * totalScale;

          // Subtle target reticle when near 1x so user sees which eye is being zoomed
          if (progress < 0.18) {
            const reticleAlpha = (1 - progress / 0.18) * 0.65;
            ctx.save();
            ctx.strokeStyle = `rgba(251, 191, 36, ${reticleAlpha})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(pupilScreenX, pupilScreenY, Math.max(14, irisRadiusPx * 1.6), 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          // Render high-resolution macro iris & cosmic pupil zoom layer
          drawMacroEyeOverlay(ctx, pupilScreenX, pupilScreenY, irisRadiusPx, progress, now * 0.001);
        }

        requestAnimationFrame(render);
      }

      // Controls & Interaction
      btnPlay.addEventListener('click', () => {
        isPlaying = !isPlaying;
        btnPlay.textContent = isPlaying ? '⏸ หยุดชั่วคราว' : '▶ เล่นซูมอัตโนมัติ';
      });

      btnReset.addEventListener('click', () => {
        progress = 0;
        direction = 1;
        updateReadout(progress);
      });

      btnEyeLeft.addEventListener('click', () => {
        activeEye = 'left';
        btnEyeLeft.classList.add('active');
        btnEyeRight.classList.remove('active');
      });

      btnEyeRight.addEventListener('click', () => {
        activeEye = 'right';
        btnEyeRight.classList.add('active');
        btnEyeLeft.classList.remove('active');
      });

      slider.addEventListener('input', (e) => {
        isPlaying = false;
        btnPlay.textContent = '▶ เล่นซูมอัตโนมัติ';
        progress = parseFloat(e.target.value) / 1000;
        updateReadout(progress);
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        isPlaying = false;
        btnPlay.textContent = '▶ เล่นซูมอัตโนมัติ';
        progress = Math.min(1, Math.max(0, progress - e.deltaY * 0.0008));
        updateReadout(progress);
      }, { passive: false });

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
